name: Release

# Se dispara al empujar un tag de versión (p. ej. v1.1.0).
# Compila el binario en Windows, macOS y Linux y los adjunta a un GitHub Release.
on:
  push:
    tags:
      - "v*"

# Necesario para que la acción pueda crear el release y subir los binarios.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: uwujacker-linux
            artifact: uwujacker
          - os: macos-latest
            asset: uwujacker-macos-arm64
            artifact: uwujacker
          - os: windows-latest
            asset: uwujacker-windows.exe
            artifact: uwujacker.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node24: el build SEA apunta a node24 (ver package.json target).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: node --test

      - name: Build single executable
        run: yarn build:exe

      # En Apple Silicon el binario SEA queda sin firma válida tras postject y
      # Gatekeeper lo mata. Una firma ad-hoc lo deja ejecutable.
      - name: Re-sign macOS binary
        if: matrix.os == 'macos-latest'
        run: |
          codesign --remove-signature dist/uwujacker || true
          codesign --sign - dist/uwujacker

      # Renombra el binario con un nombre claro por plataforma para el release.
      - name: Rename artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: mv "dist/${{ matrix.artifact }}" "dist/${{ matrix.asset }}"

      - name: Rename artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: Rename-Item "dist/${{ matrix.artifact }}" "${{ matrix.asset }}"
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Usa las notas del tag; genera notas automáticas si el tag no trae mensaje.
          generate_release_notes: true
          files: artifacts/*
